<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#6366f1" />
			<stop offset="100%" stop-color="#38bdf8" />
		</linearGradient>
		<radialGradient id="glow1" cx="50%" cy="0%" r="70%">
			<stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
			<stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="glow2" cx="90%" cy="90%" r="60%">
			<stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
			<stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
		</radialGradient>
		<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
			<path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1" />
		</pattern>
	</defs>

	<rect width="1200" height="630" fill="#090a0f" />
	<rect width="1200" height="630" fill="url(#grid)" />
	<rect width="1200" height="630" fill="url(#glow1)" />
	<rect width="1200" height="630" fill="url(#glow2)" />

	<rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(148,163,184,0.14)" stroke-width="2" />

	<!-- Logo mark -->
	<rect x="80" y="88" width="64" height="64" rx="14" fill="url(#brand)" />
	<path
		d="M100 104v32M124 104v32M100 120h24"
		stroke="#090a0f"
		stroke-width="5.5"
		stroke-linecap="round"
		fill="none"
	/>

	<text x="160" y="132" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">
		HARDRIVE<tspan fill="#38bdf8">TECH</tspan>
	</text>

	<text x="80" y="260" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">
		Systems &amp; Software
	</text>
	<text x="80" y="336" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="64" font-weight="700" fill="#38bdf8">
		Engineer
	</text>

	<text x="80" y="392" font-family="Inter, Arial, sans-serif" font-size="24" fill="#94a3b8">
		Game engines · Embedded systems · Android security · Web
	</text>

	<!-- Terminal chip -->
	<rect x="78" y="448" width="560" height="108" rx="12" fill="#11141d" stroke="rgba(148,163,184,0.16)" />
	<circle cx="106" cy="474" r="6" fill="#f87171" opacity="0.7" />
	<circle cx="126" cy="474" r="6" fill="#facc15" opacity="0.7" />
	<circle cx="146" cy="474" r="6" fill="#34d399" opacity="0.7" />
	<text x="100" y="512" font-family="JetBrains Mono, monospace" font-size="20" fill="#64748b">$ whoami</text>
	<text x="100" y="540" font-family="JetBrains Mono, monospace" font-size="20" fill="#34d399">solo-built, start to finish</text>

	<text x="1120" y="580" font-family="JetBrains Mono, monospace" font-size="18" fill="#475569" text-anchor="end">
		hardrivetech.net
	</text>
</svg>
