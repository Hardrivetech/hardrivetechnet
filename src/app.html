<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#090a0f" />

		<!-- Fontsource CDN Preconnect & Styles -->
        <link rel="preconnect" href="https://cdn.jsdelivr.com" crossorigin />
        <link
            rel="preload"
            href="https://cdn.jsdelivr.com/npm/@fontsource-variable/inter@latest/files/inter-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.com/npm/@fontsource-variable/inter@latest/index.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.com/npm/@fontsource-variable/plus-jakarta-sans@latest/index.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.com/npm/@fontsource-variable/jetbrains-mono@latest/index.css" />

		<link rel="dns-prefetch" href="//github.com" />
		%sveltekit.head%
	</head>
	<body data-shead-sveltekit-preload-data="hover" class="bg-obsidian-950 text-slate-200 antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
